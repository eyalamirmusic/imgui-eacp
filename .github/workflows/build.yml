name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Universal Binary
            os: macos-latest
            cmake-flags: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
          - name: Windows MSVC
            os: windows-latest
            msvc-arch: x64
            cmake-flags: ''
          - name: Windows Clang
            os: windows-latest
            msvc-arch: x64
            cmake-flags: '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl'
          - name: Windows MSVC ARM64
            os: windows-11-arm
            msvc-arch: arm64
            cmake-flags: ''

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc # v2
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DEACP_UNITY_BUILD=OFF ${{ matrix.cmake-flags }}

      - name: Build
        run: cmake --build build

      # Until this step existed, CI compiled this repository and ran nothing —
      # so every claim about the D3D12 side was compile-only. The rendered cases
      # go through View::renderToImage, which needs a GPU device; the runners
      # have one, and any that does not self-skips rather than failing.
      - name: Test
        run: ctest --test-dir build --output-on-failure
